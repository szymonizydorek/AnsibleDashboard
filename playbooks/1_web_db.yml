---
- name: Webserver Setup
  hosts: webservers
  become: yes
  tasks:
    - name: Ensure apt cache is up to date
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start Nginx Service
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Copy Index File to Webserver
      copy:
        src: index.html
        dest: /var/www/html
        mode: '0644'
        backup: yes

- name: Database Setup
  hosts: database
  become: yes
  tasks:
    - name: Install MariaDB
      yum:
        name: mariadb-server
        state: present

    - name: Start service MariaDB if not started
      service:
        name: mariadb
        state: started 
