---
- name: Ensure apt cache is up to date
  ansible.builtin.apt:
    update_cache: yes

- name: Install a nginx package
  apt:
    name: "{{ package_name }}"
    state: present

- name: Start the Nginx service
  service:
    name: "{{ service_name }}"
    state: started

- name: Copy NGINX site configuration
  copy:
    src: nginx.conf
    dest: /etc/nginx/sites-available/secure_site.conf
    mode: '0644'

- name: Enable site by creating symlink
  file:
    src: /etc/nginx/sites-available/secure_site.conf
    dest: /etc/nginx/sites-enabled/secure_site.conf
    state: link
    force: true

- name: Remove default site if it exists
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Test NGINX configuration
  command: nginx -t
  register: nginx_test
  failed_when: "'successful' not in nginx_test.stdout"

- name: Reload NGINX
  service:
    name: nginx
    state: reloaded

- name: Copy the shell script
  copy:
    src: get_system_info.sh
    dest: /tmp/get_system_info.sh
    mode: '0755'      

- name: Execute The Shell Script
  command: /bin/bash /tmp/get_system_info.sh
  register: script_output


- name: Parse script output into variables
  set_fact:
    hostname: "{{ script_output.stdout_lines[0].split(': ')[1] }}"
    cpu_load: "{{ script_output.stdout_lines[1].split(': ')[1] }}"
    disk_usage: "{{ script_output.stdout_lines[2].split(': ')[1] }}"
    ram_usage: "{{ script_output.stdout_lines[3].split(': ')[1] }}"


- name: Deploy HTML J2 File 
  template:
    src: templates/index.html.j2
    dest: /var/www/html/index.html
    mode: '0644'

- name: Copy CSS File 
  copy:
    src: files/style.css
    dest: /var/www/html/style.css
    mode: '0644'
